name: Update predictions and deploy site

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 15 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "football_predictor.py", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: NFL predictions
        run: python football_predictor.py export --league nfl --out _site/data/nfl.json
      - name: CFB predictions
        run: python football_predictor.py export --league cfb --out _site/data/cfb.json
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - run: cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
