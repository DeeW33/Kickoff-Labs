name: Update predictions and deploy site

on:
  schedule:
    - cron: "0 11 * * *"      # daily, ~7am Eastern
    - cron: "0 15 * * 0,6"    # Sat + Sun mid-day: fresh injury reports and forecasts
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "football_predictor.py", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write              # needed to save the pick log back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Automated checks (grading, top-5 rule, duplicates, pick-log safety, Opta freshness)
        run: python -m unittest discover -s tests -v
      - name: NFL predictions
        run: python football_predictor.py export --league nfl --out _site/data/nfl.json
      - name: Data health report
        if: always()
        run: |
          python - <<'PY'
          import json
          try:
              h = json.load(open("_site/data/nfl.json"))["health"]
          except Exception as e:
              print("::error title=No health report::the export did not produce one:", e)
          else:
              print("Overall:", h["level"].upper())
              for c in h["checks"]:
                  print(f"{c['level'].upper():6} {c['name']}: {c['detail']}")
                  if c["level"] == "warn":
                      print(f"::warning title={c['name']}::{c['detail']}")
                  if c["level"] == "error":
                      print(f"::error title={c['name']}::{c['detail']}")
          PY
      - name: Save pick log (public, timestamped by git history)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Update pick log"
            git pull --rebase origin main
            git push
          fi
      - run: cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
